name: Build and verify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.py'
      - 'VERSION'
      - 'LICENSE'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and check JavaScript
        run: |
          python3 build.py
          node --check dist/quiet-reader.user.js
          node tests/automation_unit.cjs
          node tests/reader_unit.cjs
          python3 build.py --check
      - name: Prepare isolated browser tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test mocked reading flows
        run: .venv/bin/python tests/browser_smoke.py
      - name: Publish verified release files
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src tests build.py VERSION LICENSE .github/workflows/build.yml; then
            echo "Source changed during verification; the newer run will publish."
            exit 1
          fi
          mkdir -p docs
          cp qa/panel-desktop.png docs/panel-desktop.png
          cp qa/panel-mobile.png docs/panel-mobile.png
          cp qa/results.json docs/verification.json
          git add dist docs
          if git diff --cached --quiet; then
            echo "Release files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish verified userscript [skip ci]"
          git rebase origin/main
          git push origin HEAD:main
